name: Update thin-wrap formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [thin-wrap-release]

permissions:
  contents: write

concurrency:
  group: update-thin-wrap
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Fetch latest thin-wrap release and refresh formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          api = "https://api.github.com/repos/thunderbyte-labs/thin-wrap/releases/latest"
          req = urllib.request.Request(
              api,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "thunderbyte-labs-homebrew-tap",
              },
          )
          with urllib.request.urlopen(req) as resp:
              release = json.load(resp)

          tag = release["tag_name"]
          version = tag.lstrip("v")
          assets = {a["name"]: a["browser_download_url"] for a in release.get("assets", [])}
          arm_name = "thin-wrap-Darwin-arm64.zip"
          intel_name = "thin-wrap-Darwin-x86_64.zip"
          missing = [name for name in (arm_name, intel_name) if name not in assets]
          if missing:
              raise SystemExit(f"Missing Darwin assets on {tag}: {missing}")

          def sha256(url: str) -> str:
              digest = hashlib.sha256()
              with urllib.request.urlopen(url) as resp:
                  while True:
                      chunk = resp.read(1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
              return digest.hexdigest()

          arm_url = assets[arm_name]
          intel_url = assets[intel_name]
          arm_sha = sha256(arm_url)
          intel_sha = sha256(intel_url)

          path = Path("Formula/thin-wrap.rb")
          text = path.read_text()
          original = text
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text, count=1)
          text = re.sub(
              r'url "https://github.com/thunderbyte-labs/thin-wrap/releases/download/v[^/]+/thin-wrap-Darwin-arm64.zip"',
              f'url "{arm_url}"',
              text,
              count=1,
          )
          text = re.sub(
              r'url "https://github.com/thunderbyte-labs/thin-wrap/releases/download/v[^/]+/thin-wrap-Darwin-x86_64.zip"',
              f'url "{intel_url}"',
              text,
              count=1,
          )

          sha_matches = list(re.finditer(r'sha256 "[0-9a-f]{64}"', text))
          if len(sha_matches) < 2:
              raise SystemExit(f"Expected two sha256 lines, found {len(sha_matches)}")
          # First sha256 is arm, second is Intel, matching Formula/thin-wrap.rb.
          text = text[: sha_matches[0].start()] + f'sha256 "{arm_sha}"' + text[sha_matches[0].end() :]
          sha_matches = list(re.finditer(r'sha256 "[0-9a-f]{64}"', text))
          text = text[: sha_matches[1].start()] + f'sha256 "{intel_sha}"' + text[sha_matches[1].end() :]

          env_path = Path(os.environ["GITHUB_ENV"])
          if text == original:
              print(f"Formula already matches {tag}")
              env_path.write_text("FORMULA_CHANGED=false\n")
          else:
              path.write_text(text)
              print(f"Updated formula to {tag}")
              print(f"  arm64 {arm_url}")
              print(f"  arm64 sha256={arm_sha}")
              print(f"  intel {intel_url}")
              print(f"  intel sha256={intel_sha}")
              env_path.write_text(f"FORMULA_CHANGED=true\nTHIN_WRAP_TAG={tag}\n")
          PY

      - name: Commit and push formula
        if: env.FORMULA_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/thin-wrap.rb
          git commit -m "thin-wrap ${THIN_WRAP_TAG}"
          git push
